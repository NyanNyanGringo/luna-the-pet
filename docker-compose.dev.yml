# Dev-окружение: polling + hot reload + PostgreSQL + авто-миграции.
# Запуск (foreground): docker compose -f docker-compose.dev.yml up

services:
  postgres:
    image: postgres:16
    env_file: .env.dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: luna
      POSTGRES_DB: luna_dev_db
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luna -d luna_dev_db"]
      interval: 5s
      retries: 5

  migrate:
    build: .
    env_file: .env.dev
    volumes:
      - ./backend:/app/backend
    command:
      [
        "sh",
        "-c",
        "DATABASE_URL=postgresql+asyncpg://luna:$${POSTGRES_PASSWORD}@postgres:5432/luna_dev_db alembic -c /app/backend/alembic.ini upgrade head",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.dev
    volumes:
      - ./backend:/app/backend
    command:
      [
        "sh",
        "-c",
        "DATABASE_URL=postgresql+asyncpg://luna:$${POSTGRES_PASSWORD}@postgres:5432/luna_dev_db uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pg_dev_data:
