# Локальная и продакшн-конфигурация: приложение + PostgreSQL.
# Переменные окружения берутся из .env (см. .env.example).

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - media_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: luna_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U luna
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  media_data:
